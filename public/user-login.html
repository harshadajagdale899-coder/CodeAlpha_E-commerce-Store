<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="Css/login.css" />
  </head>
  <body>
    <div id="webpage">
      <div id="login-container">
        <div id="login">
          <div id="login-heading">
            <h2 style="font-weight: 700">Login</h2>
            <p style="font-size: 14px; color: gray">Welcome back!</p>
          </div>
          <form id="login-form">
            <div class="mb-6" id="login-Email">
              <label for="inputEmail" class="form-label"> Email address </label>
              <input
                type="email"
                class="form-control"
                id="login-email-input"
                aria-describedby="emailHelp"
                style="width: 50vh"
                placeholder="abc123@gmail.com"
              />
            </div>
            <div class="mb-3" id="login-password" style="margin-top: 10px">
              <label for="inputPassword" class="form-label"> Password </label>
              <input
                type="password"
                class="form-control"
                id="login-password-input"
                style="width: 50vh"
                placeholder="**********"
              />
            </div>
            <a href="#" style="display: block; margin-top: 3vh">
              Forgot Password?</a
            >
            <button type="submit" class="btn btn-primary" id="login-btn">
              Login
            </button>
            <hr />
            <span style="margin-left: 40px; color: grey"
              >Don't have a account?</span
            >
            <a href="#">Register</a>
          </form>
        </div>
      </div>
      <div id="sign-in-container">
        <div id="sign-in">
          <div id="sign-heading">
            <h2 style="font-weight: 700">Create Account</h2>
            <p style="font-size: 14px; color: gray">Join us Today!</p>
          </div>
          <form id="sign-in-form">
            <div class="mb-6" id="user-name">
              <label for="inputName" class="form-label">Full Name</label>
              <input
                type="text"
                class="form-control"
                id="username-input"
                aria-describedby="nameHelp"
                style="width: 50vh"
                placeholder="John Doe"
              />
            </div>
            <div class="mb-6" id="sign-in-Email">
              <label for="inputEmail" class="form-label"> Email</label>
              <input
                type="email"
                class="form-control"
                id="sign-in-email-input"
                aria-describedby="emailHelp"
                style="width: 50vh"
                placeholder="abc123@gmail.com"
              />
            </div>
            <div class="mb-3" id="sign-in-password" style="margin-top: 10px">
              <label for="inputPassword" class="form-label"> Password </label>
              <input
                type="password"
                class="form-control"
                id="sign-in-password"
                style="width: 50vh"
                placeholder="**********"
              />
            </div>
            <div
              class="mb-3"
              id="sign-in-confirmPassword"
              style="margin-top: 10px"
            >
              <label for="inputPassword" class="form-label"
                >Confirm Password</label
              >
              <input
                type="password"
                class="form-control"
                id="sign-in-confirmPassword"
                style="width: 50vh"
                placeholder="**********"
              />
            </div>
            <button type="submit" class="btn btn-primary" id="sign-in-btn">
              Register
            </button>
            <hr />
            <span style="margin-left: 40px; color: grey"
              >Already have a account?</span
            >
            <a href="#">Login</a>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
